# SYNTHETIC GM-041 ENGINE FIXTURE — NOT A MODEL CONFIGURATION.
#
# Every number here is deliberately wrong for baseball so it can never be
# mistaken for the approved model: the category split is 2.8/3.1/2.1/2.2/1.8
# rather than the specified 3/3/2/2/2, and the grade table is 3.7/5.9/8.1/9.8
# rather than 4/6/8/10. Engineering does not invent baseball thresholds; the production
# allocations, buckets, and minimums remain open Product Owner decisions
# (Q11-Q16). This fixture exists only to exercise the GM-041 engine against
# real archived snapshots, so its missing-data rules anticipate exactly the
# missing reasons the frozen GM-020 pipeline records.

schema_version: 1
model_configuration_version: "gm041-engine-synthetic-0"
specification_version: "v6.3"

fuzzy_scoring:
  enabled: false

allocations:
  total_max_points: "12"

  categories:
    - category: power_profile
      max_points: "2.8"
      components: [exit_velocity, barrel_pct, hard_hit_pct]
    - category: pitcher_matchup
      max_points: "3.1"
      components: [pitch_mix_pressure, put_away_pitch_exploitation]
    - category: form
      max_points: "2.1"
      components: [sweet_spot_pct, attack_angle_quality, bat_speed]
    - category: pull_power
      max_points: "2.2"
      components: [pull_pct_air_balls]
    - category: environment
      max_points: "1.8"
      components: [park, weather]

  grade_cutoffs:
    - { grade: D, lower: "0", upper: "3.7", terminal: false }
    - { grade: C, lower: "3.7", upper: "5.9", terminal: false }
    - { grade: B, lower: "5.9", upper: "8.1", terminal: false }
    - { grade: A, lower: "8.1", upper: "9.8", terminal: false }
    - { grade: S, lower: "9.8", upper: "12", terminal: true }

components:
  - component_id: exit_velocity
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1.1"
    sample_type: batted_ball_events
    missing_data:
      policy: record_missing
      reasons: [NO_EVENTS_IN_WINDOW, TRACKING_UNAVAILABLE, INVALID_SOURCE_VALUE, SOURCE_UNAVAILABLE]
    applicable_profiles: [RECENT_7D, LONG_TERM_2Y]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 2
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "130"
            buckets:
              - { lower: "0", upper: "80", points: "0" }
              - { lower: "80", upper: "90", points: "0.55" }
              - { lower: "90", upper: "130", points: "1.1" }
      - window_profile: LONG_TERM_2Y
        minimum_sample_required: 13
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "130"
            buckets:
              - { lower: "0", upper: "80", points: "0" }
              - { lower: "80", upper: "90", points: "0.55" }
              - { lower: "90", upper: "130", points: "1.1" }

