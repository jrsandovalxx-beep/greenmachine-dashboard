# SYNTHETIC TEST FIXTURE — NOT A MODEL CONFIGURATION.
#
# Every number here was chosen to be obviously wrong for baseball so it can never
# be mistaken for the approved model. The category split is 2.7/3.3/1.9/2.4/1.7
# rather than the specified 3/3/2/2/2, and the grade table is 3.3/5.1/7.7/9.4
# rather than 4/6/8/10.
#
# Engineering does not invent baseball thresholds (ENGINEERING_GUIDELINES §8).
# The real allocations, buckets, and sample minimums are Product Owner decisions
# still open as Q11-Q18. This fixture exists only to exercise the loader.
#
# Covers: all 5 categories, all 11 components, both window profiles, both
# attack-angle measurements, bucketed and binary scoring, fractional
# allocations, and an explicitly disabled fuzzy policy.

schema_version: 1
model_configuration_version: "synthetic-fixture-0"
specification_version: "v6.3"

fuzzy_scoring:
  enabled: false

allocations:
  total_max_points: "12"

  categories:
    - category: power_profile
      max_points: "2.7"
      components: [exit_velocity, barrel_pct, hard_hit_pct]
    - category: pitcher_matchup
      max_points: "3.3"
      components: [pitch_mix_pressure, put_away_pitch_exploitation]
    - category: form
      max_points: "1.9"
      components: [sweet_spot_pct, attack_angle_quality, bat_speed]
    - category: pull_power
      max_points: "2.4"
      components: [pull_pct_air_balls]
    - category: environment
      max_points: "1.7"
      components: [park, weather]

  grade_cutoffs:
    - { grade: D, lower: "0",   upper: "3.3", terminal: false }
    - { grade: C, lower: "3.3", upper: "5.1", terminal: false }
    - { grade: B, lower: "5.1", upper: "7.7", terminal: false }
    - { grade: A, lower: "7.7", upper: "9.4", terminal: false }
    - { grade: S, lower: "9.4", upper: "12",  terminal: true }

components:
  - component_id: exit_velocity
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "0.9"
    sample_type: batted_ball_events
    missing_data:
      policy: not_evaluable
      reasons: [NO_EVENTS_IN_WINDOW, SOURCE_UNAVAILABLE]
    applicable_profiles: [RECENT_7D, LONG_TERM_2Y]
    profiles:
      - window_profile: RECENT_7D
        minimum_sample_required: 3
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "125"
            buckets:
              - { lower: "0",    upper: "62.4", points: "0" }
              - { lower: "62.4", upper: "88.1", points: "0.4" }
              - { lower: "88.1", upper: "125",  points: "0.9" }
      - window_profile: LONG_TERM_2Y
        minimum_sample_required: 11
        scoring:
          - method: bucketed
            domain_min: "0"
            domain_max: "125"
            buckets:
              - { lower: "0",    upper: "59.7", points: "0" }
              - { lower: "59.7", upper: "84.6", points: "0.4" }
              - { lower: "84.6", upper: "125",  points: "0.9" }

  - component_id: barrel_pct
    scoring_method: bucketed
    direction: higher_is_better
    max_points: "1.1"
    sample_type: batted_ball_events
    missing_data:
      policy: not_evaluable
      reasons: [NO_EVENTS_IN_WINDOW]
    applicable_profiles: [RECENT_7D, LONG_TERM_2Y]
    profiles:
